<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker-ios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-Container" id="main-Container-js">

        <h1 class="title-Class">To Do List</h1>

        <div class="input-Section" id="input-Section-js">           
                            
            <input type="text" placeholder="Enter a habit" class="input-Class">
      
            <button class="add-Button">Add</button>      
            
        </div>

        <div class="habit-List" id="habit-List">
            <h2>Habit-List</h2>
            <div class="habit-List-container"></div>    
                  
        </div>

        <button class="delete-All">delete all</button>

        <div class="habit-Counter">0/0 completed</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
